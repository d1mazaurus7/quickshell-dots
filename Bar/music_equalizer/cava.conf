; Конфиг cava для визуализации в окне плеера: сырые значения в stdout
[general]
framerate = 60
bars = 24
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 55
